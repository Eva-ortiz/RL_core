[agent.random]
timesteps = 163840 # timesteps

[agent.PPO]
# elements of optuna lists: min, max, step
# third position:
#   * if true, log scale search
#   * if float or int, step of change
#   * if false, default step by optuna
# CAUTION: names have to be the same than MaskablePPO inputs
# TIP : if param is not a list, it won't be tuned by optuna
n_steps = [5, 20, 5]
batch_size = [8, 64, 8]
n_epochs = [10, 100, true]
gamma = [0, 1, 0.2]
gae_lambda = [0, 1, 0.2]
ent_coef = 0.01
vf_coef = 0.5

seed = 0

# learn
n_envs = 4 # 0 for non vectorized environments
env_multiprocess = true
total_timesteps = 1280

# optuna
seed_optuna = 0
n_trials = 100

# agent monitorization
greedy_check_interval = 1

[agent.PPO.lr]
lr_linear_schedule = false # true for get_linear_fn scheduler, else constant value

# optuna also applies here by lists: min, max, step
# TIP : if param is not a list, it won't be tuned by optuna

# only applies if lr_linear_schedule = false
learning_rate = [1e-6, 1e-2, true]

# only applies if lr_linear_schedule = true
start = [1e-3, 1e-1, true]
end = [1e-6, 1e-4, true]
end_fraction = 0.85

[agent.PPO.net_arch] # delete for default architecture
pi = [128, 64, 48] # if states stack, bigger network is recommended, e.g. [256, 192, 128, 64, 48]
vf = [128, 64, 48]

[environment]
date_format = "%d-%m-%Y %H:%M:%S"

max_transitions = 500
max_tons = 300
max_single_capture = 100
inf_capture_value = 1000
synthetic_catch_delta = 10
path_terminal_latlon = "./data/ports.parquet"
tol_m_to_latlon = 50

paths_buoy_track_csv = ["./data/buoy_track.csv"]

[environment.reward]
capture_clip = 100 # clip capture if higher, false to avoid clipping
stop_hours = 5
time_weight = 0.5 # give more weight to time so far buoys are avoided and we encourage go to the terminal state
rescale = false # false to avoid reward rescaling

[environment.buoy_track]
df_cols = ["KEY_BALIZA", "FECHA", "HORA", "FECHA_HORA", "LATITUD", "LONGITUD", "CAPTURA"] # columns kept from buoy track data
